name: Update Premier League data

# Hourly. Matches finish a few times a week, and each run exits in seconds when
# there is nothing new, so this is cheap. Cron here is UTC.
on:
  schedule:
    - cron: "17 * * * *"   # :17 past the hour - off the busy top-of-hour slot,
                           # where GitHub's shared runners queue up
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]        # a code change should prove itself immediately
                            # rather than wait for the next hour's cron
    paths-ignore:
      - "README.md"         # docs alone cannot change what the site renders

concurrency:
  # Never let two runs write at once: a slow run overlapping the next hour's
  # would have both fetching and upserting the same matches.
  group: pl-scrape
  cancel-in-progress: false

permissions:
  contents: read
  pages: write            # publish the rendered site
  id-token: write         # required by actions/deploy-pages

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A warm run is seconds; a cold start with an empty database now has
    # ~380 matches to fetch at 3 requests each, one second apart.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and load
        env:
          # Add this under Settings -> Secrets and variables -> Actions.
          # It is the Neon connection string; never commit it.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py

      - name: Scrape Bundesliga and LaLiga
        # Separate from main.py: those two are page scrapes of a different
        # shape, not the Premier League's JSON API. Settled matches are skipped
        # like the PL's are, so a routine run costs only the matchday listings.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scrape_league.py both

      - name: Import hand-entered odds
        # odds.txt is edited straight in GitHub's web editor - paste a line,
        # commit, and the next run loads it. Upserts, so re-running is safe,
        # and an empty file is a no-op rather than a failure.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # --insert-only: this runs every hour, and a full upsert would keep
        # rewriting lines the scraper has since captured with other prices.
        run: python import_odds.py odds.txt --insert-only

      - name: Scrape odds (second chance for the odds workflow)
        # GitHub fires scheduled workflows on this repo every three to five
        # hours whatever the cron says - this "hourly" job ran six times on
        # 13 Sep, and the odds workflow's four slots produced one run in two
        # days. Attempting the odds scrape here as well turns every fire of
        # either workflow into a chance.
        #
        # --min-gap-hours makes the two share one budget: whichever lands
        # second within three hours of the other skips without spending.
        #
        # Placed before the render so a line imported here is published by
        # this same run. continue-on-error because this is a bonus: a
        # webscraper.io outage must never stop the data and the site updating.
        continue-on-error: true
        timeout-minutes: 25
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WEBSCRAPER_TOKEN: ${{ secrets.WEBSCRAPER_TOKEN }}
          WS_SITEMAP_LINKS: ${{ vars.WS_SITEMAP_LINKS || '1529498' }}
          WS_SITEMAP_MATCHES: ${{ vars.WS_SITEMAP_MATCHES || '1529506' }}
        run: |
          if [ -z "$WEBSCRAPER_TOKEN" ]; then
            echo "WEBSCRAPER_TOKEN not set - skipping the odds scrape."
            exit 0
          fi
          python odds_pipeline.py --hours 72 --skip-priced --write --min-gap-hours 3

      - name: Measure each league's prediction spread
        # Per-league sigma for the probabilities on every page - see
        # calibration.py. About half a minute. Before the render so the pages
        # use today's figures; continue-on-error because a failure here only
        # means yesterday's stored values are used, which is fine.
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python calibration.py

      - name: Freeze the advice about to be published
        # Same data and model as the render that follows, so the stored advice
        # is what this run publishes. A line whose match has kicked off is never
        # rewritten - see pl_advice in db.py. continue-on-error: a failure only
        # means this run's advice is not recorded; the previous run's stands.
        continue-on-error: true
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python advice.py

      - name: Announce new odds on Telegram
        # After the advice is frozen, so each message carries the advice this
        # run publishes. Skips cleanly until TELEGRAM_BOT_TOKEN and
        # TELEGRAM_CHAT_ID are added under Settings -> Secrets and variables ->
        # Actions. A line is marked as announced only after Telegram accepts
        # the message, so a failed send is retried by the next run.
        continue-on-error: true
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: Render the static site
        # Reads the database that was just updated and writes site/. The
        # credentials stay here, inside the Action - the published pages are
        # plain HTML with no connection string in them.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_static.py site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Save the run's JSON snapshot
        # Handy for diffing what changed if a run looks wrong. Kept short:
        # the database is the real store, this is just a breadcrumb.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: output/*.json
          retention-days: 7
          if-no-files-found: ignore

  publish:
    # Split from the scrape so a Pages misconfiguration cannot fail the job
    # that actually collects the data.
    needs: scrape
    runs-on: ubuntu-latest
    # GitHub runs one Pages deployment at a time and fails the loser. The odds
    # workflow publishes this same site when it imports a line, so both deploy
    # jobs share this group and queue instead of colliding.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
