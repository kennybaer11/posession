name: Update Premier League data

# Hourly. Matches finish a few times a week, and each run exits in seconds when
# there is nothing new, so this is cheap. Cron here is UTC.
on:
  schedule:
    - cron: "17 * * * *"   # :17 past the hour - off the busy top-of-hour slot,
                           # where GitHub's shared runners queue up
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]        # a code change should prove itself immediately
                            # rather than wait for the next hour's cron
    paths-ignore:
      - "README.md"         # docs alone cannot change what the site renders

concurrency:
  # Never let two runs write at once: a slow run overlapping the next hour's
  # would have both fetching and upserting the same matches.
  group: pl-scrape
  cancel-in-progress: false

permissions:
  contents: read
  pages: write            # publish the rendered site
  id-token: write         # required by actions/deploy-pages

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A warm run is seconds; a cold start with an empty database now has
    # ~380 matches to fetch at 3 requests each, one second apart.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and load
        env:
          # Add this under Settings -> Secrets and variables -> Actions.
          # It is the Neon connection string; never commit it.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py

      - name: Scrape Bundesliga and LaLiga
        # Separate from main.py: those two are page scrapes of a different
        # shape, not the Premier League's JSON API. Settled matches are skipped
        # like the PL's are, so a routine run costs only the matchday listings.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scrape_league.py both

      - name: Import hand-entered odds
        # odds.txt is edited straight in GitHub's web editor - paste a line,
        # commit, and the next run loads it. Upserts, so re-running is safe,
        # and an empty file is a no-op rather than a failure.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python import_odds.py odds.txt

      - name: Render the static site
        # Reads the database that was just updated and writes site/. The
        # credentials stay here, inside the Action - the published pages are
        # plain HTML with no connection string in them.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python export_static.py site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Save the run's JSON snapshot
        # Handy for diffing what changed if a run looks wrong. Kept short:
        # the database is the real store, this is just a breadcrumb.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: output/*.json
          retention-days: 7
          if-no-files-found: ignore

  publish:
    # Split from the scrape so a Pages misconfiguration cannot fail the job
    # that actually collects the data.
    needs: scrape
    runs-on: ubuntu-latest
    # GitHub runs one Pages deployment at a time and fails the loser. The odds
    # workflow publishes this same site when it imports a line, so both deploy
    # jobs share this group and queue instead of colliding.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
