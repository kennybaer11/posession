# /etc/nginx/sites-available/betken - certbot adds the HTTPS server block.
#
# betken.cz is the same app as posession.cz: nginx sends both domains to it,
# and once app.CANONICAL_HOST is set the app itself forwards posession.cz
# (and www.betken.cz) to https://betken.cz with a 301. So posession's own
# nginx file never needs editing - the redirect lives in code.
server {
    listen 80;
    listen [::]:80;
    server_name betken.cz www.betken.cz;

    client_max_body_size 10m;   # admin spreadsheet uploads

    location /static/ {
        alias /home/app/scraper/static/;
        expires 1d;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
